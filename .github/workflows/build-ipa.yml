name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tock.xcodeproj \
            -scheme Tock \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee xcodebuild.log | grep -E "error:|warning: .*Swift|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Tock.app

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Tock.app
          # Ad-hoc sign so the entitlements travel with the binaries;
          # LiveContainer / SideStore re-sign on install anyway.
          codesign --force --sign - --entitlements Widget/TockWidget.entitlements "$APP/PlugIns/TockWidget.appex"
          codesign --force --sign - --entitlements App/Tock.entitlements "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Days.ipa Payload
          ls -lh Days.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Days-ipa
          path: Days.ipa

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Old release name from before the move to main; harmless once gone.
          gh release delete tock-latest --yes --cleanup-tag || true
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Days.ipa \
            --target "$GITHUB_SHA" \
            --title "Days (latest build)" \
            --notes "Unsigned IPA built from ${GITHUB_SHA::7}. Install with LiveContainer, SideStore or AltStore." \
            --prerelease

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
